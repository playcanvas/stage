name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run TypeScript
              run: npm run typecheck

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            # the browser tests have little timing margin in a 2-core runner's software gl, so a failed test runs once more,
            # alone; a test that fails twice fails the job
            - name: Run Tests
              env:
                  RERUN: ${{ runner.temp }}/rerun.json
              run: |
                  node --test --test-concurrency=1 --test-rerun-failures="$RERUN" test/*.test.ts ||
                      node --test --test-concurrency=1 --test-rerun-failures="$RERUN" test/*.test.ts

    plugin:
        name: Plugin
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Validate Claude plugin
              run: npx -y @anthropic-ai/claude-code@2.1.296 plugin validate plugins/playcanvas-stage --strict

            - name: Validate Claude marketplace
              run: npx -y @anthropic-ai/claude-code@2.1.296 plugin validate . --strict
